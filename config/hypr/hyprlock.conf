background {
    monitor =
    path = screenshot  # Utilise une capture d'écran comme fond
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor = eDP-1
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Mot de passe...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 64
    font_family = Noto Sans

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A %d %B")"
    font_size = 22
    font_family = JetBrains Mono Nerd Font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2

    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "Pas touche !!"
    font_size = 14
    font_family = Noto Sans

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2

    position = 0, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "À mwa"
    font_size = 14
    font_family = Noto Sans

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2

    position = 0, 30
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:0] if [ -x ~/.config/hypr/scripts/random-quote.sh ]; then echo "$(~/.config/hypr/scripts/random-quote.sh)"; else echo ";)"; fi
    font_size = 20
    font_family = Noto Sans

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2

    position = -10, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "󰁹 $(cat /sys/class/power_supply/BAT1/capacity)%"
    color = rgba(200, 200, 200, 1.0)
    font_size = 18
    font_family = Noto Sans

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2

    position = 0, -50
    halign = center
    valign = top
}
